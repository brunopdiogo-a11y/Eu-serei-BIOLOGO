<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9fbf9"><title>Ecologia Vegetal · EU SEREI BIOLOGO</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#f4f8f4;color:#243d2c}header{height:55px;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid #e2eae2;gap:10px}a{color:#236c44;text-decoration:none;font-weight:700}small{color:#788b7c}.reader{display:block;height:calc(100dvh - 55px);width:100%;border:0;background:#fff}.error{margin:48px auto;padding:24px;background:white;border:1px solid #dfeade;border-radius:14px;max-width:680px}.clock{position:fixed;bottom:20px;right:20px;z-index:99999;display:flex;align-items:center;gap:9px;border:1px solid #c9dfcc;background:#fff;box-shadow:0 8px 38px #112b192a;padding:11px 12px;border-radius:14px;font-variant-numeric:tabular-nums}.clock strong{font-size:18px;min-width:79px}.clock button{border:0;border-radius:8px;padding:9px 11px;color:#fff;background:#25764b;font-weight:700;cursor:pointer}.clock button.secondary{background:#edf4ee;color:#286045}.clock small{font-size:10px;display:block;color:#8a9a8b}.hide{display:none!important}@media(max-width:600px){header{height:52px;font-size:12px}.reader{height:calc(100dvh - 52px)}.clock{bottom:14px;right:10px;left:10px;justify-content:center;padding:8px 10px}.clock strong{font-size:16px}}.voice[hidden]{display:none!important}.voice{position:fixed;z-index:99998;bottom:99px;right:20px;width:min(490px,calc(100% - 30px));background:#fff;border:1px solid #d4e5d7;box-shadow:0 8px 35px #143b2025;border-radius:14px;padding:13px;display:grid;gap:10px}.voice-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.voice-head strong{color:#245b39}.voice-stage{font-size:12px;color:#637b69;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.voice-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.voice button{border:0;border-radius:8px;padding:9px 10px;background:#25764b;color:#fff;font-weight:700;font-size:12px;cursor:pointer}.voice button.alt{background:#edf4ee;color:#286045}.voice button:disabled{opacity:.4;cursor:not-allowed}.voice select{max-width:225px;min-width:0;flex:1;border:1px solid #dce7dc;border-radius:8px;background:#fff;padding:8px;font-size:12px}.voice label{font-size:12px;color:#647967}.voice input[type=range]{width:100px;accent-color:#25764b}.voice-status{color:#6b826e;font-size:11px;line-height:1.4}.voice-hint{font-size:10px;color:#849b87}@media(max-width:600px){.voice{left:10px;right:10px;bottom:95px;width:auto;padding:10px}.voice select{max-width:calc(100% - 76px)}.voice-row{gap:5px}.voice button{padding:8px}.voice label{font-size:11px}.voice input[type=range]{width:95px}.voice-stage{max-width:calc(100vw - 100px)}}</style></head><body>
<header><a href="./index.html">← EU SEREI BIOLOGO</a><small>🌿 Arquivo privado neste dispositivo</small></header>
<div id="message" class="error">Abrindo material privado…</div>
<iframe id="reader" class="reader hide" title="Aulas e atividades de Ecologia Vegetal" referrerpolicy="no-referrer"></iframe>
<div class="clock hide" id="clock" aria-label="Cronômetro de estudo"><span>⏱️</span><div><strong id="elapsed">00:00:00</strong><small id="clock-status">Pausado</small></div><button id="toggle">▶ Iniciar</button><button class="secondary" id="close-session">Salvar e sair</button></div>
<section class="voice" id="voice-panel" aria-label="Leitor em voz alta" hidden>
  <div class="voice-head"><strong>🔊 Ouvir a etapa</strong><small id="voice-paragraph">Selecione uma etapa</small></div>
  <div class="voice-stage" id="voice-stage"></div>
  <div class="voice-row">
    <button id="voice-start">▶ Ouvir etapa</button>
    <button class="alt" id="voice-stop" disabled>■ Parar</button>
    <button class="alt" id="voice-prev" title="Trecho anterior">⏮</button>
    <button class="alt" id="voice-next" title="Próximo trecho">⏭</button>
  </div>
  <div class="voice-row"><label for="voice-selection">Voz</label><select id="voice-selection" aria-label="Escolha uma voz"></select><label for="voice-rate">Ritmo</label><input type="range" id="voice-rate" min="0.7" max="1.5" step="0.1" value="0.9"><span id="voice-rate-value">0.9×</span></div>
  <span class="voice-status" id="voice-status" role="status">Pronto para a leitura.</span>
  <span class="voice-hint">Lê apenas o desenvolvimento do conteúdo. Não narra questões e menus. A disponibilidade offline depende da voz instalada.</span>
</section>
<script type="module">
import {readEcologia} from './js/private-library.js';
import {initStageSpeech} from './js/voice-reader.js';
const storageKey='estudos:v1';
let running=false,last=0,pendingMs=0,shownMs=0,ticker;
const $=id=>document.getElementById(id);
function display(){const s=Math.floor(shownMs/1000);$('elapsed').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':');$('toggle').textContent=running?'⏸ Pausar':shownMs?'▶ Continuar':'▶ Iniciar';$('clock-status').textContent=running?'Estudando · tempo contabilizado':'Pausado';}
function checkpoint(){if(!running)return;const n=performance.now(),diff=Math.max(0,n-last);last=n;pendingMs+=diff;shownMs+=diff;if(pendingMs>=5000)commit();display();}
function commit(){const m=pendingMs/60000;if(m<=0)return;try{const s=JSON.parse(localStorage.getItem(storageKey)||'{}');if(!Array.isArray(s.sessions))s.sessions=[];const d=new Date(),date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const id=crypto.randomUUID?.()||('study-'+Date.now()+'-'+Math.random());s.sessions.push({id,courseId:'ecologia-vegetal',type:'reading',minutes:Math.round(m*10000)/10000,date,createdAt:new Date().toISOString(),source:'private-reader'});s.schemaVersion=1;s.updatedAt=new Date().toISOString();localStorage.setItem(storageKey,JSON.stringify(s));pendingMs=0;}catch(err){$('clock-status').textContent='Falha ao salvar · faça backup';}}
function pause(){checkpoint();running=false;clearInterval(ticker);commit();display();}
function resume(){if(running)return;running=true;last=performance.now();ticker=setInterval(checkpoint,1000);display();}
$('toggle').onclick=()=>running?pause():resume();
$('close-session').onclick=()=>{pause();location.href='./index.html';};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('pagehide',pause);
try{
 const entry=await readEcologia();if(!entry)throw Error('Material não encontrado. Volte à biblioteca e importe o HTML completo de Ecologia Vegetal.');
 // Documento escolhido pelo usuário, não publicado no GitHub.
 const frame=$('reader');initStageSpeech(frame,$('voice-panel'));frame.srcdoc=entry.html;frame.classList.remove('hide');$('clock').classList.remove('hide');$('message').remove();display();
 // O estudante inicia a contagem manualmente no botão Iniciar.
 // Ao ocultar, fechar a aba ou sair da página, a sessão é pausada e registrada.
}catch(err){$('message').textContent='Não foi possível abrir: '+err.message;}
</script></body></html>
