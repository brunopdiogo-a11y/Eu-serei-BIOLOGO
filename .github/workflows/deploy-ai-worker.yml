name: Publicar Tutor IA EU SEREI BIOLOGO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-worker/src/**'
      - 'ai-worker/test/**'
      - 'ai-worker/wrangler.toml'
      - '.github/workflows/deploy-ai-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar configurações obrigatórias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STUDY_ACCESS_TOKEN: ${{ secrets.STUDY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }
          test "${#STUDY_ACCESS_TOKEN}" -ge 24 || { echo "::error::Defina STUDY_ACCESS_TOKEN aleatório com 24+ caracteres"; exit 1; }
      - name: Validar serviço
        run: node --test ai-worker/test/worker.test.mjs
      - name: Implantar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config ai-worker/wrangler.toml
      - name: Enviar código privado do tutor ao Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STUDY_ACCESS_TOKEN: ${{ secrets.STUDY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$STUDY_ACCESS_TOKEN" | npx --yes wrangler@4 secret put STUDY_ACCESS_TOKEN --config ai-worker/wrangler.toml
          echo "Tutor Workers AI publicado. Confira a URL HTTPS no painel Cloudflare Workers."
