name: Publicar EU SEREI BIOLOGO Web
on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar versão Web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validar arquivos Web
        run: |
          test -f www/index.html
          test -f www/styles.css
          test -f www/js/app.js
      - name: Preparar arquivos com versão anti-cache
        run: python3 scripts/prepare-web-release.py
      - name: Validar arquivos preparados
        run: |
          test -f _site/index.html
          test -f _site/ecologia-privada.html
          grep -q 'js/app.js?v=' _site/index.html
          grep -q 'voice-reader.js?v=' _site/ecologia-privada.html
      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Aguardar disponibilidade do artefato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              echo 'Artefato disponível para publicação'
              exit 0
            fi
            sleep 10
          done
          echo 'Artefato ainda indisponível na API após 120 segundos' >&2
          exit 1
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
