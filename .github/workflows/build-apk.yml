name: Construir APK EU SEREI BIOLOGO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Criar projeto Android
        run: npx cap add android
      - name: Sincronizar aplicativo
        run: npx cap sync android
      - name: Compilar APK de teste
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Nomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EU_SEREI_BIOLOGO.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: EU_SEREI_BIOLOGO
          path: EU_SEREI_BIOLOGO.apk
          if-no-files-found: error
          retention-days: 30
