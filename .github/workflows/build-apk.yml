name: Construir APK EU SEREI BIOLOGO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android-launcher/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar módulos JavaScript Web
        run: |
          node --check www/js/voice-reader.js
          node --check www/js/app.js
          node --check www/js/private-library.js
      - name: Preparar acesso Web seguro no Android
        run: |
          npx esbuild android-launcher/entry.js --bundle --format=iife --platform=browser --outfile=android-launcher/main.js
          node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('capacitor.config.json'));cfg.webDir='android-launcher';fs.writeFileSync('capacitor.config.json',JSON.stringify(cfg,null,2))"
      - name: Criar projeto Android
        run: npx cap add android
      - name: Autorizar uso de alarmes Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permission='<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in s:
              s=s.replace('<application',permission+'\n    <application',1)
              p.write_text(s)
          PY
      - name: Sincronizar aplicativo
        run: npx cap sync android
      - name: Aplicar ícone oficial Android
        run: node scripts/generate-android-icons.mjs
      - name: Confirmar registro nativo do Browser
        run: |
          test -f android/app/src/main/assets/capacitor.plugins.json
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q 'BrowserPlugin' android/app/src/main/assets/capacitor.plugins.json
          grep -q 'LocalNotificationsPlugin' android/app/src/main/assets/capacitor.plugins.json
      - name: Validar lembretes JavaScript
        run: node --check android-launcher/entry.js
      - name: Compilar APK de teste
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Nomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EU_SEREI_BIOLOGO.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: EU_SEREI_BIOLOGO
          path: EU_SEREI_BIOLOGO.apk
          if-no-files-found: error
          retention-days: 30
