name: Construir APK EU SEREI BIOLOGO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android-launcher/**'
      - 'android-native/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar módulos JavaScript Web
        run: |
          node --check www/js/voice-reader.js
          node --check www/js/study-questions.js
          node --check ai-worker/src/index.js
          node --test ai-worker/test/worker.test.mjs
          node --check www/js/speech-text.js
          node scripts/test-speech-text.mjs
          node --check www/js/app.js
          node --check www/js/private-library.js
      - name: Preparar aplicativo Android integrado
        run: |
          mkdir -p android-web
          cp -a www/. android-web/
          cp android-launcher/index.html android-web/reminders.html
          npx esbuild android-launcher/entry.js --bundle --format=iife --platform=browser --outfile=android-web/main.js
          npx esbuild android-native/speech-bridge.js --bundle --format=esm --platform=browser --outfile=android-web/js/native-speech-runtime.js
          npx esbuild android-native/diagnostic-bridge.js --bundle --format=esm --platform=browser --outfile=android-web/js/native-diagnostic-runtime.js
          node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('capacitor.config.json'));cfg.webDir='android-web';fs.writeFileSync('capacitor.config.json',JSON.stringify(cfg,null,2))"
          test -f android-web/index.html
          test -f android-web/ecologia-privada.html
          test -f android-web/reminders.html
      - name: Criar projeto Android
        run: npx cap add android
      - name: Autorizar uso de alarmes Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permission='<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in s:
              s=s.replace('<application',permission+'\n    <application',1)
              p.write_text(s)
          PY
      - name: Integrar narração Android em segundo plano
        run: |
          set -e
          JAVA_DIR=android/app/src/main/java/br/com/eusereibiologo/app
          mkdir -p "$JAVA_DIR"
          cp android-native/StudySpeechPlugin.java "$JAVA_DIR/"
          cp android-native/BackupExportPlugin.java "$JAVA_DIR/"
          cp android-native/NativeDriveAuthPlugin.java "$JAVA_DIR/"
          cp android-native/KokoroSetupPlugin.java "$JAVA_DIR/"
          cp android-native/NativeDriveAuthActivity.java "$JAVA_DIR/"
          cp android-native/AppHealthPlugin.java "$JAVA_DIR/"
          cp android-native/StudyDictationPlugin.java "$JAVA_DIR/"
          cp android-native/StudySpeechService.java "$JAVA_DIR/"
          cp android-native/StudyControlsPlugin.java "$JAVA_DIR/"
          cp android-native/StudyControlsService.java "$JAVA_DIR/"
          cp android-native/StudyAlarmPlugin.java "$JAVA_DIR/"
          cp android-native/StudyAlarmReceiver.java "$JAVA_DIR/"
          cp android-native/StudyAlarmBootReceiver.java "$JAVA_DIR/"
          cp android-native/StudyAlarmService.java "$JAVA_DIR/"
          cp android-native/StudyAlarmActivity.java "$JAVA_DIR/"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/br/com/eusereibiologo/app/MainActivity.java')
          s=p.read_text()
          if 'registerPlugin(StudySpeechPlugin.class)' not in s:
              s=s.replace('super.onCreate(savedInstanceState);','registerPlugin(StudySpeechPlugin.class);\n        super.onCreate(savedInstanceState);')
              if 'registerPlugin(StudySpeechPlugin.class)' not in s:
                  s=s.replace('public class MainActivity extends BridgeActivity {','public class MainActivity extends BridgeActivity {\n    @Override public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(StudySpeechPlugin.class);\n        super.onCreate(savedInstanceState);\n    }')
              p.write_text(s)
          if 'registerPlugin(AppHealthPlugin.class)' not in s:
              s=s.replace('registerPlugin(StudySpeechPlugin.class);', 'registerPlugin(StudySpeechPlugin.class);\n        registerPlugin(AppHealthPlugin.class);')
              p.write_text(s)
          if 'registerPlugin(StudyDictationPlugin.class)' not in s:
              s=s.replace('registerPlugin(AppHealthPlugin.class);','registerPlugin(AppHealthPlugin.class);\n        registerPlugin(StudyDictationPlugin.class);')
              p.write_text(s)
          if 'registerPlugin(StudyAlarmPlugin.class)' not in s:
              s=s.replace('registerPlugin(AppHealthPlugin.class);','registerPlugin(AppHealthPlugin.class);\n        registerPlugin(StudyAlarmPlugin.class);')
              p.write_text(s)
          if 'registerPlugin(StudyControlsPlugin.class)' not in s:
              s=s.replace('registerPlugin(StudyAlarmPlugin.class);','registerPlugin(StudyAlarmPlugin.class);\n        registerPlugin(StudyControlsPlugin.class);')
              p.write_text(s)
          # Registrar o backup somente depois de criar o onCreate e inserir os demais plugins.
          s=p.read_text()
          if 'registerPlugin(BackupExportPlugin.class)' not in s:
              anchor='registerPlugin(StudySpeechPlugin.class);'
              assert anchor in s, 'Registro do StudySpeech ausente'
              s=s.replace(anchor,anchor+'\n        registerPlugin(BackupExportPlugin.class);',1)
              p.write_text(s)
          s=p.read_text()
          if 'registerPlugin(KokoroSetupPlugin.class)' not in s:
              anchor='registerPlugin(StudySpeechPlugin.class);'
              assert anchor in s
              s=s.replace(anchor,anchor+'\n        registerPlugin(KokoroSetupPlugin.class);',1)
              p.write_text(s)
          s=p.read_text()
          if 'registerPlugin(NativeDriveAuthPlugin.class)' not in s:
              anchor='registerPlugin(StudySpeechPlugin.class);'
              assert anchor in s, 'Registro base não encontrado'
              s=s.replace(anchor,anchor+'\n        registerPlugin(NativeDriveAuthPlugin.class);',1)
              p.write_text(s)
          assert 'registerPlugin(NativeDriveAuthPlugin.class)' in p.read_text()
          assert 'registerPlugin(BackupExportPlugin.class)' in p.read_text(), 'BackupExport não registrado'
          assert 'registerPlugin(StudyControlsPlugin.class)' in p.read_text()
          assert 'registerPlugin(StudyAlarmPlugin.class)' in p.read_text()
          assert 'registerPlugin(AppHealthPlugin.class)' in p.read_text()
          assert 'registerPlugin(StudyDictationPlugin.class)' in p.read_text()
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          for permission in ['android.permission.FOREGROUND_SERVICE','android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK','android.permission.WAKE_LOCK','android.permission.POST_NOTIFICATIONS','android.permission.VIBRATE','android.permission.USE_FULL_SCREEN_INTENT','android.permission.RECEIVE_BOOT_COMPLETED']:
              line=f'<uses-permission android:name="{permission}" />'
              if line not in m:
                  m=m.replace('<application',line+'\n    <application',1)
          entry='<service android:name=".StudySpeechService" android:exported="false" android:foregroundServiceType="mediaPlayback" />'
          if entry not in m:m=m.replace('</application>',entry+'\n    </application>')
          media_service='<service android:name=".StudyControlsService" android:exported="false" android:foregroundServiceType="mediaPlayback" />'
          if media_service not in m:m=m.replace('</application>',media_service+'\n    </application>')
          drive_auth_activity='<activity android:name=".NativeDriveAuthActivity" android:exported="false" />'
          if drive_auth_activity not in m:m=m.replace('</application>',drive_auth_activity+'\n    </application>')
          alarm_receiver='<receiver android:name=".StudyAlarmReceiver" android:enabled="true" android:exported="false" />'
          alarm_service='<service android:name=".StudyAlarmService" android:exported="false" android:foregroundServiceType="mediaPlayback" />'
          alarm_activity='<activity android:name=".StudyAlarmActivity" android:exported="false" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:showWhenLocked="true" android:turnScreenOn="true" />'
          for entry in [alarm_receiver,alarm_service,alarm_activity]:
              if entry not in m:m=m.replace('</application>',entry+'\n    </application>')
          boot_receiver='<receiver android:name=".StudyAlarmBootReceiver" android:enabled="true" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /></intent-filter></receiver>'
          if 'StudyAlarmBootReceiver' not in m:m=m.replace('</application>',boot_receiver+'\\n    </application>')
          # Android 11+: o mecanismo de TTS precisa ser visível à aplicação.
          queries='<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>'
          if 'android.intent.action.TTS_SERVICE' not in m:
              m=m.replace('<application',queries+'\n    <application',1)
          manifest.write_text(m)
          assert 'registerPlugin(StudySpeechPlugin.class)' in p.read_text()
          assert 'StudySpeechService' in m
          assert 'StudyAlarmReceiver' in m
          assert 'StudyAlarmService' in m
          assert 'StudyAlarmActivity' in m
          assert 'StudyControlsService' in m
          PY
      - name: Adicionar dependência Google Play Services AuthorizationClient
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          dependency="implementation 'com.google.android.gms:play-services-auth:22.0.0'"
          assert 'dependencies {' in s, 'Bloco dependencies não encontrado'
          if dependency not in s:
              s=s.replace('dependencies {','dependencies {\n    '+dependency,1)
              p.write_text(s)
          PY
      - name: Gerar som do alarme de estudo
        run: python3 scripts/generate-reminder-sound.py
      - name: Sincronizar aplicativo
        run: npx cap sync android
      - name: Aplicar ícone oficial Android
        run: node scripts/generate-android-icons.mjs
      - name: Confirmar integração nativa
        run: |
          test -f android/app/src/main/assets/capacitor.plugins.json
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q 'LocalNotificationsPlugin' android/app/src/main/assets/capacitor.plugins.json
      - name: Validar lembretes e ponte Android
        run: |
          node --check android-launcher/entry.js
          node --check www/js/native-platform.js
          node --check android-native/speech-bridge.js
          node --check android-native/diagnostic-bridge.js
          node --check www/js/app-diagnostics.js
      - name: Definir versão Android incremental
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import re
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          number=int(os.environ['BUILD_NUMBER'])+100
          version=json.loads(Path('package.json').read_text())['version']
          s,n1=re.subn(r'\bversionCode\s+\d+',f'versionCode {number}',s,count=1)
          s,n2=re.subn(r'\bversionName\s+["\'][^"\']+["\']',f'versionName "{version}"',s,count=1)
          if n1!=1 or n2!=1:
              raise SystemExit('Não foi possível definir versionCode/versionName do Android')
          p.write_text(s)
          print(f'Android: versionCode={number} versionName={version}')
          PY
      - name: Compilar APK com assinatura permanente
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_B64 e ANDROID_SIGNING_PASSWORD em Settings > Secrets and variables > Actions."
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/eu-serei-biologo-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          python3 scripts/configure-android-signing.py
          cd android
          bash ./gradlew assembleRelease --no-daemon
      - name: Nomear e verificar APK assinado
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk EU_SEREI_BIOLOGO.apk
          test -s EU_SEREI_BIOLOGO.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify EU_SEREI_BIOLOGO.apk
          echo "SHA-1 do certificado de assinatura (cadastre este valor no cliente OAuth Android):"
          # Extrai o certificado assinado com parser flexível; não bloqueia
          # um APK válido por divergência de rótulos na saída do apksigner.
          "$APKSIGNER" verify --print-certs EU_SEREI_BIOLOGO.apk > "$RUNNER_TEMP/apk-certs.txt" 2>&1
          CERT_SHA1="$(python3 - <<'PY'
          import re
          from pathlib import Path
          data=Path('/tmp/unused').read_text() if False else Path(__import__('os').environ['RUNNER_TEMP'],'apk-certs.txt').read_text()
          hits=re.findall(r'(?:SHA[ -]?1|SHA1)\s*(?:digest|fingerprint)?\s*:\s*([a-fA-F0-9:]{40,59})',data,re.I)
          cleaned=[re.sub(r'[^a-fA-F0-9]','',x).lower() for x in hits]
          print(next((x for x in cleaned if len(x)==40),''))
          PY
          )"
          echo "### OAuth Android — impressão digital SHA-1" >> "$GITHUB_STEP_SUMMARY"
          echo 'Pacote: `br.com.eusereibiologo.app`' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CERT_SHA1" ]; then
            echo "SHA-1 do APK assinado: $CERT_SHA1"
            echo "SHA-1: \`$CERT_SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::O APK foi validado, mas a saída do apksigner não trouxe o SHA-1 no formato esperado."
            echo "SHA-1: consulte a saída do apksigner na etapa Nomear e verificar APK assinado." >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/apk-certs.txt"
          fi
          echo "Registre o cliente OAuth Android no Google Cloud com o mesmo projeto OAuth Web." >> "$GITHUB_STEP_SUMMARY"
          echo "APK release assinado e validado."
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: EU_SEREI_BIOLOGO_RELEASE
          path: EU_SEREI_BIOLOGO.apk
          if-no-files-found: error
          retention-days: 30
      - name: Oferecer APK para download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-preview >/dev/null 2>&1; then
            gh release create android-preview --prerelease --title "EU SEREI BIOLOGO - APK assinado" --notes "Assinatura permanente. Para migrar do APK debug antigo, pode ser necessário desinstalar uma única vez. Mantenha a mesma chave de assinatura em todas as versões."
          fi
          gh release upload android-preview EU_SEREI_BIOLOGO.apk --clobber
